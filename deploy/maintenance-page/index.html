<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1220" />
    <title>Site en maintenance</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg-0: #eef1f6;
        --bg-1: #ffffff;
        --ink: #10192e;
        --ink-soft: #4b5670;
        --line: #dde2ec;
        --accent: #3159e8;
        --accent-soft: #e4e9fc;
      }

      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg-0: #0b1220;
          --bg-1: #131d33;
          --ink: #eef1f8;
          --ink-soft: #97a2c0;
          --line: #232f4d;
          --accent: #7d9bff;
          --accent-soft: #1b264a;
        }
      }

      :root[data-theme="dark"] {
        --bg-0: #0b1220;
        --bg-1: #131d33;
        --ink: #eef1f8;
        --ink-soft: #97a2c0;
        --line: #232f4d;
        --accent: #7d9bff;
        --accent-soft: #1b264a;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg-0);
        background-image: radial-gradient(circle at 15% 8%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 42%);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        padding: max(1.5rem, env(safe-area-inset-top)) max(1.25rem, env(safe-area-inset-right))
          max(1.5rem, env(safe-area-inset-bottom)) max(1.25rem, env(safe-area-inset-left));
      }

      main {
        width: 100%;
        max-width: 26rem;
      }

      .panel {
        background: var(--bg-1);
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 2.25rem 2rem 2rem;
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04), 0 16px 40px -24px rgba(15, 23, 42, 0.35);
      }

      .mark {
        width: 3rem;
        height: 3rem;
        margin-bottom: 1.5rem;
        color: var(--accent);
      }

      .mark circle.track {
        stroke: var(--accent-soft);
      }

      .mark circle.sweep {
        stroke: var(--accent);
        stroke-linecap: round;
        transform-origin: 50% 50%;
        animation: sweep 2.4s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }

      @media (prefers-reduced-motion: reduce) {
        .mark circle.sweep {
          animation: none;
          stroke-dasharray: 70 200;
        }
      }

      @keyframes sweep {
        0% {
          stroke-dasharray: 1 200;
          transform: rotate(0deg);
        }
        50% {
          stroke-dasharray: 100 200;
          transform: rotate(180deg);
        }
        100% {
          stroke-dasharray: 1 200;
          transform: rotate(360deg);
        }
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        font-size: 0.6875rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--accent);
        margin: 0 0 0.75rem;
      }

      .eyebrow::before {
        content: "";
        width: 0.4rem;
        height: 0.4rem;
        border-radius: 999px;
        background: var(--accent);
      }

      h1 {
        font-size: 1.5rem;
        line-height: 1.25;
        font-weight: 650;
        letter-spacing: -0.01em;
        margin: 0 0 0.625rem;
        text-wrap: balance;
      }

      p {
        margin: 0;
        color: var(--ink-soft);
        font-size: 0.9375rem;
        line-height: 1.6;
        max-width: 34ch;
      }

      .divider {
        height: 1px;
        background: var(--line);
        margin: 1.5rem 0 1.25rem;
      }

      .meta {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 1rem;
        font-size: 0.75rem;
        color: var(--ink-soft);
      }

      .meta strong {
        color: var(--ink);
        font-weight: 600;
      }

      footer {
        margin-top: 1.25rem;
        text-align: center;
        font-size: 0.75rem;
        color: var(--ink-soft);
        opacity: 0.75;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="panel">
        <svg class="mark" viewBox="0 0 48 48" fill="none" aria-hidden="true">
          <circle class="track" cx="24" cy="24" r="19" stroke-width="3" />
          <circle class="sweep" cx="24" cy="24" r="19" stroke-width="3" />
        </svg>

        <p class="eyebrow">Intervention en cours</p>
        <h1>Ce site fait une pause technique.</h1>
        <p>
          Une maintenance est en cours sur ce service. Il sera de retour sous peu — merci de repasser
          dans quelques instants.
        </p>

        <div class="divider"></div>

        <div class="meta">
          <span>Statut</span>
          <strong>Maintenance planifiée</strong>
        </div>
      </div>

      <footer>Administré via Server Admin</footer>
    </main>
  </body>
</html>
